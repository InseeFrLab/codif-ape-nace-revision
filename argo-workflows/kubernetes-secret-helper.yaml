# Secret Kubernetes pour les identifiants LLM Lab.
#
# ⚠️  NE PAS COMMITTER ce fichier une fois les vraies valeurs renseignées.
#     stringData accepte du texte clair : Kubernetes l'encode en base64 tout seul.
#
# Créer / mettre à jour :  kubectl apply -f argo-workflows/secret-llmlab.template.yaml
apiVersion: v1
kind: Secret
metadata:
  name: secret-llmlab
  namespace: projet-ape
type: Opaque
stringData:
  LLMLAB_URL: "https://llm.labxxxxxxx"
  LLMLAB_API_KEY: "sk-xxxxxxxxxxxxxxxx"
