apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  # generateName (not a fixed name) so every submission gets a unique run, e.g.
  # run-relabel-x7k2p. That name doubles as the default job-id (see
  # resolve-job-id), harmonising: Argo run name == job-id == S3 output dir ==
  # MLflow run_name prefix.
  generateName: run-relabel-
spec:
  serviceAccountName: workflow
  entrypoint: main
  # Parameter VALUES live in argo-workflows/params.yaml and are supplied at
  # submit time via `--parameter-file` (see argo-workflows/argo_helper.md).
  # Only the declarations (names) are kept here so templates can reference
  # {{workflow.parameters.X}}; a value not provided at submit fails fast.
  arguments:
    parameters:
      - name: mode              # "prod" (produce dataset) or "eval" (metrics on annotated rows)
      - name: strategy          # "cag" or "rag"
      - name: input-url         # S3 path to the input parquet (prod only; empty for eval)
      - name: experiment-name   # MLflow experiment name
      - name: branch            # git branch to checkout
      - name: job-id            # "" => defaults to the Argo run name; set a value to resume a crashed run
      - name: batch-size        # rows per batch in step 3
      - name: sample-size       # step 3: sample N rows for a quick test ("" = full run)
      - name: collection-name   # Qdrant collection (RAG)
      - name: embedding-model   # embedding model for step 1 (empty = script default)
      - name: build-vector-db   # "true" to (re)build the vector DB in step 1 (RAG only)
      - name: params-conf-list  # JSON list of models; single item skips voting in eval

  # Defaults applied to every template's container. Previously expressed with
  # plain CPU image.
  templateDefaults:
    container:
      image: inseefrlab/onyxia-vscode-python:py3.13.12
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c"]
      resources:
        requests:
          memory: 2Gi
          cpu: 100m
        limits:
          memory: 50Gi
          cpu: 15000m
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: my-s3-creds
              key: accessKey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: my-s3-creds
              key: secretKey
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: AWS_S3_ENDPOINT
          value: minio.lab.sspcloud.fr
        - name: QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: qdrant-apikey
              key: api-key
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: publicKey
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: secretKey
        - name: LLMLAB_URL
          valueFrom:
            secretKeyRef:
              name: secret-llmlab
              key: LLMLAB_URL
        - name: LLMLAB_API_KEY
          valueFrom:
            secretKeyRef:
              name: secret-llmlab
              key: LLMLAB_API_KEY
        - name: MLFLOW_S3_ENDPOINT_URL
          value: https://minio.lab.sspcloud.fr
        - name: MLFLOW_TRACKING_URI
          value: https://projet-ape-mlflow.user.lab.sspcloud.fr/
        - name: LANGFUSE_HOST
          value: https://langfuse.lab.sspcloud.fr
        - name: QDRANT_URL
          value: https://projet-ape-qdrant.user.lab.sspcloud.fr/
        - name: COLLECTION_NAME
          value: "{{workflow.parameters.collection-name}}"

  templates:
    # =========================================================================
    # DAG — full pipeline:
    #   0 validate ──┬─> 1 build-vector-db (rag, opt-in) ─┐
    #                ├─> 2 encode-unambiguous (prod) ──────┼─> 5 build-final (prod)
    #                └─> 3 encode (fan-out) ─> aggregate ─> 4 ensemble ─┘
    # =========================================================================
    - name: main
      dag:
        tasks:
          # Resolve the effective job-id ONCE (empty param => auto-<timestamp>),
          # then every step consumes this single value so all outputs land under
          # the same workflow_relabel/<job-id>/ directory.
          - name: resolve-job-id
            template: resolve-job-id
            arguments:
              parameters:
                - name: job-id
                  value: "{{workflow.parameters.job-id}}"

          - name: validate
            template: validate

          - name: build-vector-db
            template: build-vector-db
            dependencies: [validate]
            when: "'{{workflow.parameters.strategy}}' == 'rag' && '{{workflow.parameters.build-vector-db}}' == 'true'"

          - name: encode-unambiguous
            template: encode-unambiguous
            dependencies: [validate, resolve-job-id]
            when: "'{{workflow.parameters.mode}}' == 'prod'"
            arguments:
              parameters:
                - name: job-id
                  value: "{{tasks.resolve-job-id.outputs.parameters.job-id}}"

          - name: encode-ambiguous
            template: run-encode
            dependencies: [validate, build-vector-db, resolve-job-id]
            arguments:
              parameters:
                - name: LLM_NAME
                  value: "{{item.LLM_NAME}}"
                - name: job-id
                  value: "{{tasks.resolve-job-id.outputs.parameters.job-id}}"
            withParam: "{{workflow.parameters.params-conf-list}}"

          - name: aggregate
            template: aggregate-run-ids
            dependencies: [encode-ambiguous, resolve-job-id]
            arguments:
              parameters:
                - name: params-conf-list
                  value: "{{workflow.parameters.params-conf-list}}"
                - name: job-id
                  value: "{{tasks.resolve-job-id.outputs.parameters.job-id}}"
                - name: mode
                  value: "{{workflow.parameters.mode}}"

          - name: ensemble
            template: run-ensemble
            dependencies: [aggregate, resolve-job-id]
            when: "'{{tasks.aggregate.outputs.parameters.should-ensemble}}' == 'true'"
            arguments:
              parameters:
                - name: RUN_IDS
                  value: "{{tasks.aggregate.outputs.parameters.run-ids}}"
                - name: job-id
                  value: "{{tasks.resolve-job-id.outputs.parameters.job-id}}"

          - name: build-final
            template: build-final
            dependencies: [encode-unambiguous, ensemble, resolve-job-id]
            when: "'{{workflow.parameters.mode}}' == 'prod'"
            arguments:
              parameters:
                - name: job-id
                  value: "{{tasks.resolve-job-id.outputs.parameters.job-id}}"

    # =========================================================================
    # Resolve job-id — empty param => the Argo run name ({{workflow.name}});
    # otherwise pass the provided value through (resume). Computed once here so
    # all steps share the same id (and thus the same output dir / MLflow names).
    # =========================================================================
    - name: resolve-job-id
      inputs:
        parameters:
          - name: job-id
      outputs:
        parameters:
          - name: job-id
            valueFrom:
              path: /tmp/job_id.txt
      container:
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        args:
          - |
            JOB_ID="{{inputs.parameters.job-id}}"
            if [ -z "$JOB_ID" ]; then
              JOB_ID="{{workflow.name}}"
            fi
            printf '%s' "$JOB_ID" > /tmp/job_id.txt
            echo "Resolved job-id: $JOB_ID"

    # =========================================================================
    # Step 0 — input validation (gate). CPU defaults; env inherited.
    # =========================================================================
    - name: validate
      container:
        args:
          - |
            git clone https://github.com/InseeFrLab/codif-ape-nace-revision.git
            cd codif-ape-nace-revision/
            git checkout {{workflow.parameters.branch}}
            uv sync

            CMD="uv run src/0_input_validation.py --mode {{workflow.parameters.mode}}"
            if [ "{{workflow.parameters.input-url}}" != "" ]; then
              CMD="$CMD --input_url {{workflow.parameters.input-url}}"
            fi
            echo "Executing: $CMD"
            eval $CMD

    # =========================================================================
    # Step 1 — build vector DB (RAG only, opt-in). Defaults; env inherited.
    # =========================================================================
    - name: build-vector-db
      container:
        args:
          - |
            git clone https://github.com/InseeFrLab/codif-ape-nace-revision.git
            cd codif-ape-nace-revision/
            git checkout {{workflow.parameters.branch}}
            uv sync

            CMD="uv run src/1_build_vector_db.py --collection_name {{workflow.parameters.collection-name}}"
            if [ "{{workflow.parameters.embedding-model}}" != "" ]; then
              CMD="$CMD --model_name {{workflow.parameters.embedding-model}}"
            fi
            echo "Executing: $CMD"
            eval $CMD

    # =========================================================================
    # Step 2 — encode unambiguous (prod). CPU defaults; env inherited.
    # =========================================================================
    - name: encode-unambiguous
      inputs:
        parameters:
          - name: job-id
      container:
        args:
          - |
            git clone https://github.com/InseeFrLab/codif-ape-nace-revision.git
            cd codif-ape-nace-revision/
            git checkout {{workflow.parameters.branch}}
            uv sync

            CMD="uv run src/2_encode_unambiguous.py --job_id {{inputs.parameters.job-id}}"
            if [ "{{workflow.parameters.input-url}}" != "" ]; then
              CMD="$CMD --input_url {{workflow.parameters.input-url}}"
            fi
            echo "Executing: $CMD"
            eval $CMD

    # =========================================================================
    # Step 3 — encode ambiguous (one container per model, fan-out).
    #          Defaults; env inherited.
    # =========================================================================
    - name: run-encode
      inputs:
        parameters:
          - name: LLM_NAME
          - name: job-id
      container:
        args:
          - |
            git clone https://github.com/InseeFrLab/codif-ape-nace-revision.git
            cd codif-ape-nace-revision/
            git checkout {{workflow.parameters.branch}}
            uv sync

            CMD="uv run src/3_encode_ambiguous.py \
              --strategy {{workflow.parameters.strategy}} \
              --mode {{workflow.parameters.mode}} \
              --experiment_name {{workflow.parameters.experiment-name}} \
              --llm_name {{inputs.parameters.LLM_NAME}} \
              --collection_name {{workflow.parameters.collection-name}} \
              --job_id {{inputs.parameters.job-id}} \
              --batch_size {{workflow.parameters.batch-size}}"

            if [ "{{workflow.parameters.input-url}}" != "" ]; then
              CMD="$CMD --input_url {{workflow.parameters.input-url}}"
            fi
            if [ "{{workflow.parameters.sample-size}}" != "" ]; then
              CMD="$CMD --sample_size {{workflow.parameters.sample-size}}"
            fi

            echo "Executing: $CMD"
            eval $CMD

    # =========================================================================
    # Aggregate — read run IDs written to S3 by each encode task and decide
    #             whether the ensemble step should run. Overrides resources
    #             (small) and env (adds PARAMS/JOB_ID/MODE).
    # =========================================================================
    - name: aggregate-run-ids
      inputs:
        parameters:
          - name: params-conf-list
          - name: job-id
          - name: mode
      outputs:
        parameters:
          - name: should-ensemble
            valueFrom:
              path: /tmp/should_ensemble.txt
          - name: run-ids
            valueFrom:
              path: /tmp/run_ids.txt
      container:
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        args:
          - |
            pip install s3fs -q

            cat > /tmp/aggregate.py << 'PYEOF'
            import json, os
            import s3fs

            params = json.loads(os.environ["PARAMS"])
            job_id = os.environ["JOB_ID"]
            mode = os.environ["MODE"]
            fs = s3fs.S3FileSystem(
                client_kwargs={"endpoint_url": f"https://{os.environ['AWS_S3_ENDPOINT']}"},
                key=os.environ["AWS_ACCESS_KEY_ID"],
                secret=os.environ["AWS_SECRET_ACCESS_KEY"],
            )

            # Ensemble runs when there are several models, or always in prod
            # (single-model prod still needs the final file written to S3).
            should = len(params) > 1 or mode == "prod"

            run_ids = []
            if should:
                for item in params:
                    llm_name = item["LLM_NAME"].replace("/", "_")
                    path = f"projet-ape/NAF-revision/workflow_relabel/{job_id}/run_ids/{llm_name}.txt"
                    with fs.open(path) as f:
                        run_ids.append(f.read().decode().strip())

            open("/tmp/should_ensemble.txt", "w").write("true" if should else "false")
            open("/tmp/run_ids.txt", "w").write(",".join(run_ids))
            print(f"should_ensemble={should} run_ids={run_ids}")
            PYEOF

            python3 /tmp/aggregate.py
        env:
          - name: PARAMS
            value: "{{inputs.parameters.params-conf-list}}"
          - name: JOB_ID
            value: "{{inputs.parameters.job-id}}"
          - name: MODE
            value: "{{inputs.parameters.mode}}"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: accessKey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: secretKey
          - name: AWS_S3_ENDPOINT
            value: minio.lab.sspcloud.fr

    # =========================================================================
    # Step 4 — majority-vote ensemble across all model predictions.
    #          CPU defaults; env inherited.
    # =========================================================================
    - name: run-ensemble
      inputs:
        parameters:
          - name: RUN_IDS
          - name: job-id
      container:
        args:
          - |
            git clone https://github.com/InseeFrLab/codif-ape-nace-revision.git
            cd codif-ape-nace-revision/
            git checkout {{workflow.parameters.branch}}
            uv sync

            CMD="uv run src/4_ensemble_predictions.py \
              --run_ids {{inputs.parameters.RUN_IDS}} \
              --mode {{workflow.parameters.mode}} \
              --job_id {{inputs.parameters.job-id}}"

            if [ "{{workflow.parameters.mode}}" = "prod" ]; then
              CMD="$CMD --export"
            fi

            echo "Executing: $CMD"
            eval $CMD

    # =========================================================================
    # Step 5 — build the final NACE 2025 dataset (prod).
    #          CPU defaults; env inherited.
    # =========================================================================
    - name: build-final
      inputs:
        parameters:
          - name: job-id
      container:
        args:
          - |
            git clone https://github.com/InseeFrLab/codif-ape-nace-revision.git
            cd codif-ape-nace-revision/
            git checkout {{workflow.parameters.branch}}
            uv sync

            CMD="uv run src/5_build_nace2025_sirene4.py --job_id {{inputs.parameters.job-id}}"
            if [ "{{workflow.parameters.input-url}}" != "" ]; then
              CMD="$CMD --input_url {{workflow.parameters.input-url}}"
            fi
            echo "Executing: $CMD"
            eval $CMD
