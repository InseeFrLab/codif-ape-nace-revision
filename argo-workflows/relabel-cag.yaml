apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: run-relabel-naf08-to-naf25
spec:
  serviceAccountName: workflow
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 64Gi
  entrypoint: main
  arguments:
    parameters:
      - name: params-conf-list
        value: '[
          {"LLM_NAME": "Qwen/Qwen3-32B", "STRATEGY": "cag", "only_annotated": "false"},
          {"LLM_NAME": "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B", "STRATEGY": "cag", "only_annotated": "false"},
          {"LLM_NAME": "mistralai/Mistral-Small-3.2-24B-Instruct-2506", "STRATEGY": "cag", "only_annotated": "false"}
          ]'

  templates:
    - name: main
      dag:
        parallelism: 3
        tasks:
          - name: relabel-naf08-to-naf25
            template: run-relabel
            arguments:
              parameters:
                - name: LLM_NAME
                  value: "{{item.LLM_NAME}}"
                - name: STRATEGY
                  value: "{{item.STRATEGY}}"
                - name: only_annotated
                  value: "{{item.only_annotated}}"
            withParam: "{{workflow.parameters.params-conf-list}}"
    - name: run-relabel
      inputs:
        parameters:
          - name: LLM_NAME
          - name: STRATEGY
          - name: only_annotated
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-H100-NVL
                      - NVIDIA-H100-PCIe
      container:
        image: inseefrlab/onyxia-vscode-pytorch:py3.12.11-gpu
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: 30000m
            memory: 200Gi
          requests:
            cpu: 11000m
            memory: 100Gi
        command: ["/bin/bash", -c]
        args:
          - |
            git clone https://github.com/InseeFrLab/codif-ape-nace-revision.git
            cd codif-ape-nace-revision/
            git checkout doc-jp
            uv sync
            # uv run huggingface-cli login --token $HF_TOKEN
            # uv run huggingface-cli download {{inputs.parameters.LLM_NAME}}
            
            CMD="uv run src/encode_ambiguous.py --strategy {{inputs.parameters.STRATEGY}} --experiment_name NACE2025_DATASET --llm_name {{inputs.parameters.LLM_NAME}} --sample_size 600"

            echo "Executing: $CMD"
            eval $CMD
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
        env:
          # env var for s3 connexion
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: accessKey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: secretKey
          - name: AWS_DEFAULT_REGION
            value: us-east-1
          - name: AWS_S3_ENDPOINT
            value: minio.lab.sspcloud.fr
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
          - name: QDRANT_API_KEY
            valueFrom:
              secretKeyRef:
                name: qdrant-apikey
                key: api-key
          - name: LANGFUSE_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: langfuse-secrets
                key: publicKey
          - name: LANGFUSE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: langfuse-secrets
                key: secretKey
          - name: MLFLOW_S3_ENDPOINT_URL
            value: https://minio.lab.sspcloud.fr
          - name: MLFLOW_TRACKING_URI
            value: https://projet-ape-mlflow.user.lab.sspcloud.fr/
          - name: LANGFUSE_HOST
            value: https://langfuse.lab.sspcloud.fr
          - name: QDRANT_URL
            value: https://projet-ape-qdrant.user.lab.sspcloud.fr/
          - name: COLLECTION_NAME
            value: embeddings_qwen
          - name: TORCH_CUDA_ARCH_LIST
            value: "9.0"
          - name: VLLM_USE_FLASHINFER_SAMPLER
            value: "1"
