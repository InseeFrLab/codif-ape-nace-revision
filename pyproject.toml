[project]
name = "codif-ape-nace-revision"
version = "0.1.0"
description = "This repository is dedicated to the revision of the Nomenclature statistique des Activités économiques dans la Communauté Européenne (NACE)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-community>=0.3.1",
    "langchain-openai>=0.3.19",
    "langchain-qdrant>=0.2.0",
    "mlflow>=2.16.2",
    "openpyxl>=3.1.3",
    "pandas>=2.2.2",
    "xlrd>=2.0.1",
    "s3fs>=2025.3.2",
    "duckdb>=1.2.1",
    "langfuse>=2.0.0",
    "huggingface-hub[cli]>=0.33.1",
    "jupyter>=1.1.1",
    "seaborn>=0.13.2",
    "plotly>=6.3.0",
    "python-dotenv>=1.1.1",
    "openai>=1.102.0",
    "tenacity>=9.0.0",
    "nest-asyncio>=1.6.0",
]
authors = [
  {name="Thomas Faria", email="thomas.faria@insee.fr"}
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pre-commit>=4.2.0",
    "vulture>=2.14"
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 120

[tool.uv]
default-groups = ["dev"]

[tool.vulture]
paths = ["src"]
ignore_decorators = ["@model_validator"]
min_confidence = 80
